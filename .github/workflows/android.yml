name: Android CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Grant execute permission for gradlew
        working-directory: ./AndroidApp
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: ./AndroidApp
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        working-directory: ./AndroidApp
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Deck-debug-apk
          path: AndroidApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets release-pkg/WiFi-Deck
          cp AndroidApp/app/build/outputs/apk/debug/app-debug.apk "release-assets/WiFi-Deck-${TAG_NAME}.apk"
          cp WiFi-Deck.ino *.h *.cpp release-pkg/WiFi-Deck/
          cp -r tools release-pkg/WiFi-Deck/
          (cd release-pkg && zip -r "../release-assets/WiFi-Deck-Firmware-${TAG_NAME}.zip" WiFi-Deck)
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" "release-assets/WiFi-Deck-${TAG_NAME}.apk" "release-assets/WiFi-Deck-Firmware-${TAG_NAME}.zip" --clobber
          else
            gh release create "${TAG_NAME}" "release-assets/WiFi-Deck-${TAG_NAME}.apk" "release-assets/WiFi-Deck-Firmware-${TAG_NAME}.zip" \
              --title "WiFi-Deck ${TAG_NAME}" \
              --generate-notes
          fi
